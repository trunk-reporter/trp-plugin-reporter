[package]
# The plugin's id: it names the executable, the release files and the plugin's
# entry in the registry.
name = "trunk-reporter"
version = "0.3.0"
edition = "2024"
description = "Call, unit and talkgroup history with tr-engine's API and pages, stored in SQLite."
license = "MIT"
repository = "https://github.com/trunk-reporter/trunk-reporter"
homepage = "http://127.0.0.1:8092/"
authors = ["Andrew Miller <snarglefluffer@gmail.com>"]
rust-version = "1.85"
publish = false

[dependencies]
trunk-recorder-plugin = "0.5"
rusqlite = { version = "0.41", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
# The settings form is drawn from the config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
walkdir = "2"
futures-util = "0.3"
# The client for the transcribe plugin (rustls keeps the Windows build free of OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
# Reading response bodies in the API tests.
http-body-util = "0.1"
# Raw sockets in the SSE tests.
tokio = { version = "1", features = ["io-util"] }
# WebSocket clients in the live-audio tests.
tokio-tungstenite = "0.26"

[profile.release]
strip = true
lto = true
